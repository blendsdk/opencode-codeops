name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type (auto derives it from conventional commits)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dist_tag:
        description: "npm dist-tag (latest = stable, next/beta = pre-release)"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Require main for the latest tag
        if: inputs.dist_tag == 'latest' && github.ref != 'refs/heads/main'
        run: |
          echo "Publishing with the 'latest' tag is only allowed from main."
          echo "Current ref: ${{ github.ref }}"
          echo "Use the 'next' or 'beta' tag for other branches."
          exit 1

  release:
    name: Version & Publish
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install current npm
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, tag, and publish
        id: release
        run: |
          BEFORE=$(git rev-parse HEAD)
          node scripts/release.mjs release \
            --type "${{ inputs.version_type }}" \
            --tag "${{ inputs.dist_tag }}" \
            --ci \
            --git-push
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Published opencode-codeops@${VERSION} with tag '${{ inputs.dist_tag }}'"
          else
            echo "Nothing to release: no changes since the last tag; opencode-codeops@${VERSION} is unchanged"
          fi
