name: Verify Full

on:
  workflow_call:

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check, test, and check version parity
        run: npm run verify

      - name: Verify the publish payload
        run: npm pack --dry-run
