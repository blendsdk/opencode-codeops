name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full:
    name: Verify Full
    uses: ./.github/workflows/verify-full.yml

  verify:
    name: Verify
    needs: [full]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the full gate
        run: test "${{ needs.full.result }}" = "success"
